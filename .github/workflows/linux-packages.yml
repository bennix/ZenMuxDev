name: Linux packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/zenmux-zencode-provider

jobs:
  deb-rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install deb and rpm packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev build-essential
          sudo gem install fpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ubuntu deb and Linux rpm
        working-directory: packages/desktop
        env:
          ZCODE_ENV: production
          ZCODE_LINUX_TARGETS: deb,rpm
        run: node scripts/bundle.mjs --os linux --arch x64

      - name: Upload deb and rpm
        uses: actions/upload-artifact@v4
        with:
          name: zencode-linux-x64
          if-no-files-found: error
          path: |
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
